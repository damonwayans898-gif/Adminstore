<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Registration</title>
</head>
<body>
    <h1>Register Your Store</h1>
    <form action="#" method="post">
        <label for="storeName">Store Name:</label><br>
        <input type="text" id="storeName" name="storeName" required><br>
        <label for="ownerName">Owner Name:</label><br>
        <input type="text" id="ownerName" name="ownerName" required><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
